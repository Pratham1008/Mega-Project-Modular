<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" 
      th:replace="~{EmailLayout :: html(title='Pending Connection Requests — KIT AlumniConnect', headerColor='#6366f1', headerEmoji='🤝', headerTitle='Someone Wants to Connect!', headerSub='Your weekly connection summary', footerNote='You receive this only when you have unanswered requests — at most once per week.', content=~{::content})}">
<th:block th:fragment="content">
    <table width="100%" border="0" cellpadding="0" cellspacing="0">
        <tr>
            <td style="padding-bottom: 24px;">
                <p style="margin:0 0 8px;font-size:16px;font-weight:700;color:#1f2937;">
                    Hi <span th:text="${name}">Member</span> 👋
                </p>
                <p style="margin:0;font-size:14px;color:#4b5563;line-height:1.6;">
                    You have connection requests waiting for a response. Grow your network and stay
                    connected with the KIT community!
                </p>
            </td>
        </tr>
        <tr>
            <td style="padding-bottom: 24px;">
                <table border="0" cellpadding="0" cellspacing="0" bgcolor="#eef2ff" style="border:1px solid #c7d2fe;border-radius:24px;">
                    <tr>
                        <td valign="middle" style="padding:6px 12px;font-size:16px;">🔗</td>
                        <td valign="middle" style="padding:6px 16px 6px 0;">
                            <span style="font-size:14px;font-weight:700;color:#4f46e5;" th:text="${count} + ' pending connection request' + (${count} > 1 ? 's' : '')"></span>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr>
            <td style="padding-bottom: 24px;">
                <table width="100%" border="0" cellpadding="0" cellspacing="0">
                    <th:block th:each="r : ${requesters}" th:with="hasPhoto=${not #strings.isEmpty(r.photoUrl)}">
                        <tr>
                            <td style="padding:12px 0;border-bottom:1px solid #e5e7eb;" width="56">
                                <img th:if="${hasPhoto}" th:src="${r.photoUrl}" width="44" height="44" style="border-radius:50%;border:1px solid #d1d5db;display:block;" alt="photo" />
                                <table th:unless="${hasPhoto}" width="44" height="44" border="0" cellpadding="0" cellspacing="0" bgcolor="#4f46e5" style="border-radius:50%;">
                                    <tr>
                                        <td align="center" valign="middle" style="font-size:18px;font-weight:700;color:#ffffff;line-height:1;" th:text="${not #strings.isEmpty(r.name) ? #strings.toUpperCase(#strings.substring(r.name,0,1)) : 'U'}">A</td>
                                    </tr>
                                </table>
                            </td>
                            <td style="padding:12px 0;border-bottom:1px solid #e5e7eb;">
                                <p style="margin:0;font-size:14px;font-weight:700;color:#1f2937;" th:text="${r.name}">Requester</p>
                                <p style="margin:2px 0 0;font-size:12px;color:#6b7280;">wants to connect with you on AlumniConnect</p>
                            </td>
                        </tr>
                    </th:block>
                </table>
            </td>
        </tr>
        <tr>
            <td align="center">
                <table border="0" cellpadding="0" cellspacing="0">
                    <tr>
                        <td align="center" bgcolor="#4f46e5" style="border-radius:8px;">
                            <a href="https://alumniconnect-lovat.vercel.app/connections" style="display:inline-block;padding:12px 24px;color:#ffffff;text-decoration:none;font-size:14px;font-weight:700;border:1px solid #4338ca;border-radius:8px;">
                                Review &amp; Respond &rarr;
                            </a>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</th:block>
</html>
