spring.application.name=Mega_Project
server.port=8080

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=MegaProject
spring.data.mongodb.auto-index-creation=false

server.tomcat.threads.max=400
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=200
server.tomcat.connection-timeout=5000

server.http2.enabled=true

server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

spring.threads.virtual.enabled=true

app.security.chat.encryption-key=${CHAT_ENCRYPTION_KEY}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.test-connection=false
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectionpoolsize=10
spring.mail.properties.mail.smtp.connectionpooltimeout=10000
app.mail.sender-email=noreply@prathameshcorporations.site
resend.api-key=${RESEND_API_KEY:}

spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

logging.level.org.springframework.security=WARN
logging.level.org.springframework.data.mongodb=WARN
logging.level.org.springframework.cache=WARN

razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
firebase.service-key=${FIREBASE_SERVICE_KEY:}

management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=when-authorized

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

app.jwt.rsa-private-key=${JWT_RSA_PRIVATE_KEY}
app.jwt.rsa-public-key=${JWT_RSA_PUBLIC_KEY}