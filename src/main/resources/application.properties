spring.application.name=Mega_Project
server.port=8080

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

app.upload.dir=uploads
app.base-url=https://alumni-backend.up.railway.app

spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=MegaProject
spring.data.mongodb.auto-index-creation=true

app.security.chat.encryption-key=${CHAT_ENCRYPTION_KEY}

spring.threads.virtual.enabled=true
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/plain
server.compression.min-response-size=1024

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.test-connection=false
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

app.mail.sender-email=noreply@prathameshcorporations.site

spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

logging.level.org.springframework.security=WARN
logging.level.org.springframework.data.mongodb=WARN

razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
